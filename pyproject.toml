[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fstk"
version = "1.0.0.dev0"
description = "FromStunToKill: evidence-gated LaserDisc capture to delivery pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.2",
    "opencv-python>=4.10",
    "Pillow>=11",
    "psutil>=5.9",  # pause/resume: suspend and continue running tool processes
    "soxr>=0.5",  # exact-ratio LD audio rate correction (fstk.media.resample)
]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
# VapourSynth (R82 tested) and every plugin the generated scripts load, as PyPI wheels (Windows, macOS, Linux)
media = [
    "vapoursynth>=72",
    "vapoursynth-bestsource",
    "vapoursynth-tivtc",
    "vapoursynth-mvtools",
    "vapoursynth-mvutensils",  # namespace `mvu`: vsjetpack 2.2's QTempGaussMC motion search (its `denoise` extra)
    "vapoursynth-zsmooth",     # namespace `zsmooth`: vsrgtools' median/repair inside QTempGaussMC (vsjetpack `deinterlace` extra)
    "vapoursynth-znedi3",
    "vapoursynth-eedi3",
    "vapoursynth-resize2",
    "vapoursynth-akarin",
    "vapoursynth-vszip",
    "vsjetpack>=2.2,<3",
]
dev = ["pytest>=8", "ruff>=0.6", "pytest-qt>=4.4"]

[project.scripts]
fstk = "fstk.cli.main:main"

[project.gui-scripts]
fstk-gui = "fstk.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fstk = ["templates/*", "templates/*.gz", "py.typed", "data/dvd_openings/*.json", "data/dvd_openings/*/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "media: needs ffmpeg/ffprobe on PATH (synthetic media only)",
    "gui: needs PySide6 and a display or offscreen platform",
    "v38: characterization test that also imports the read-only v38 reference tree",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "RUF059", "E702", "E741"]
