[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fstk"
version = "1.0.0.dev0"
description = "FromStunToKill: evidence-gated LaserDisc capture to delivery pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.2",
    "opencv-python>=4.10",
    "Pillow>=11",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = ["pytest>=8", "ruff>=0.6", "pytest-qt>=4.4"]

[project.scripts]
fstk = "fstk.cli.main:main"

[project.gui-scripts]
fstk-gui = "fstk.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fstk = ["templates/*", "templates/*.gz", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "media: needs ffmpeg/ffprobe on PATH (synthetic media only)",
    "gui: needs PySide6 and a display or offscreen platform",
    "v38: characterization test that also imports the read-only v38 reference tree",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "RUF059"]
