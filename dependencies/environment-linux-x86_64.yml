name: ld-pipeline-v7-linux-x86_64-candidate
channels:
  - conda-forge
dependencies:
  - python=3.10.14
  - vapoursynth=82
  - ffmpeg=9.0.2
  - zimg
  - fftw
  - pkg-config
  - pip
